aid: brightside-health
name: Brightside Health
description: >-
  Brightside Health is a U.S. national telehealth provider of evidence-based psychiatry (medication
  management) and therapy for people aged 13 and older, founded in 2017 and headquartered in San
  Francisco. It treats the full acuity spectrum — depression, anxiety, bipolar and mood disorders,
  OCD, PTSD, ADHD, insomnia, substance and alcohol use disorder, and behavioral addictions — using
  measurement-based care (PHQ-9/GAD-7 tracking) and precision prescribing, and runs virtual
  Intensive Outpatient Programs plus an evidence-based Suicide Prevention Program (Crisis Care) for
  elevated suicide risk. Care is delivered in all 50 states, in-network with Aetna, Cigna,
  Optum/UnitedHealthcare, Blue Cross Blue Shield, Ambetter, Medicare and Medicaid, alongside
  self-pay. The platform is HIPAA compliant and has earned HITRUST Certified status for information
  security. Brightside sells to health plans, health systems and medical groups with EHR
  integration, ADT notifications and a patient referral portal, but publishes no public developer
  program, API reference or machine-readable specification — partner integration is arranged
  through its partnerships team.
