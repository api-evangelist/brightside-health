x-coverage:
  state: gated
  reason: sales-gate
  detail: >-
    Brightside Health markets a real programmatic surface to health systems — "Integration with your
    EHR for seamless discharge planning", "ADT notifications" and a Patient Referral Portal — but the
    only route to it is a "Contact our Partnership Team / Get in touch" form; the 2026-08-15 sweep
    confirmed api.brightside.com IS a live versioned Rails REST API whose /v1/ and /api/v1/ paths
    reach the origin (JSON envelope {"errors":["Record not found"]}) while every other path is held
    behind a Cloudflare bot challenge, and no route index, schema, docs or specification endpoint
    exists on it — the only public machine-readable surface on any Brightside host is the marketing
    site's WordPress REST index at /wp-json/, which is CMS boilerplate, not a product API.
