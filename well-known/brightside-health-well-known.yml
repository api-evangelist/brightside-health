  - {path: /.well-known/ai-plugin.json, status: 403, body: cloudflare-bot-challenge}
  - {path: /.well-known/agent-card.json, status: 403, body: cloudflare-bot-challenge}
  - {path: /.well-known/agent.json, status: 403, body: cloudflare-bot-challenge}
  - {path: /.well-known/mcp.json, status: 403, body: cloudflare-bot-challenge}
  - {path: /v1/.well-known/openid-configuration, status: 404, body: '{"errors":["Record not found"]}'}
- host: https://app.brightside.com
  role: patient application (single-page app)
  note: >-
    FALSE-POSITIVE REJECTED. Every /.well-known/* path returns 302 to the application shell, which
    then answers 200 with identical HTML. Followed with redirects this looks like a 200 on
    /.well-known/agent-card.json; it is an SPA catch-all, not an agent card. No A2A artifact written.
  documents:
  - {path: /.well-known/agent-card.json, status: 302, redirect_to: app shell, content_type: text/html}
  - {path: /.well-known/agent.json, status: 302, redirect_to: app shell, content_type: text/html}
