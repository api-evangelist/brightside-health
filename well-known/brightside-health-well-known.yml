  - {path: /.well-known/mcp.json, status: 404}
- host: https://api.brightside.com
  role: private backend for the app.brightside.com patient application
  note: >-
    Cloudflare answers most anonymous requests with a "Just a moment..." bot-challenge interstitial
    (HTTP 403). The 403s below are the challenge, not an origin response. NEW 2026-08-15: paths under
    /v1/ and /api/v1/ DO reach the Rails origin — see contract_discovery below.
  documents:
