  note: >-
    No /.well-known/ discovery document is published on any Brightside Health host. This file records
    the probe so the absence is evidenced rather than assumed; no WellKnown or SecurityTxt pointer is
    wired in apis.yml because nothing was found. Re-probed 2026-08-15 with the same result as
    2026-08-08, plus the wider contract-discovery sweep recorded below.
hosts:
